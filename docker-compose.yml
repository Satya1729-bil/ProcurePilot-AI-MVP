services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurepilot}
      POSTGRES_USER: ${POSTGRES_USER:-procurepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
    ports: ["5432:5432"]
    volumes: ["procurepilot_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procurepilot} -d ${POSTGRES_DB:-procurepilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://procurepilot:local-demo-change-me@db:5432/procurepilot}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  procurepilot_db:
